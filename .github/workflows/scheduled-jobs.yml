# Triggers the API's secret-guarded maintenance endpoints. The API may scale
# to zero, so these can't be in-process timers. Requires repository secrets
# APP_URL (e.g. https://glamr.app) and CRON_SECRET. Schedules only run from
# the default branch.
name: Scheduled jobs

on:
  schedule:
    - cron: "7 16 * * 1"   # weekly digest, Mondays 16:07 UTC
    - cron: "17 3 * * *"   # abandoned-upload cleanup, daily 03:17 UTC
  workflow_dispatch:
    inputs:
      job:
        description: "Job to run"
        required: true
        type: choice
        options: [digest, cleanup]

permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Call endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          JOB: ${{ github.event_name == 'workflow_dispatch' && inputs.job || (github.event.schedule == '7 16 * * 1' && 'digest' || 'cleanup') }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL and CRON_SECRET secrets must be set" >&2
            exit 1
          fi
          case "$JOB" in
            digest) path=/api/digest/run ;;
            cleanup) path=/api/storage/uploads/cleanup ;;
            *) echo "unknown job $JOB" >&2; exit 1 ;;
          esac
          curl --fail-with-body --silent --show-error --max-time 600 \
            -X POST -H "x-cron-secret: $CRON_SECRET" "$APP_URL$path"
